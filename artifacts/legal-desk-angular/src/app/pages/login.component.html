<div class="login-page" dir="rtl">
  <div class="login-card card">
    <div class="logo">LD</div>
    <h1>LegalDesk</h1>
    <p class="lead">دخول إدارة المكتب والمحامين</p>
    <a href="/consultation" class="btn btn-secondary">زائر؟ اطلب استشارة قانونية</a>

    <form class="login-form" (ngSubmit)="submit()">
      <div>
        <label class="label" for="email">البريد الإلكتروني</label>
        <input
          id="email"
          class="input"
          type="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          name="email"
          required
        />
      </div>

      <div>
        <label class="label" for="password">كلمة المرور</label>
        <input
          id="password"
          class="input"
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
        />
      </div>

      @if (error()) {
        <div class="error-banner">{{ error() }}</div>
      }

      <button class="btn btn-primary full-width" type="submit" [disabled]="busy()">
        {{ busy() ? 'جارٍ تسجيل الدخول...' : 'تسجيل الدخول' }}
      </button>
    </form>

    <div class="meta-row">
      <span>Demo:</span>
      <strong>admin@legaldesk.sa / password123</strong>
    </div>
  </div>
</div>
