<div class="shell" dir="rtl">
  <aside class="sidebar card">
    <div class="brand">
      <div class="brand-mark">LD</div>
      <div>
        <h1>LegalDesk</h1>
        <p>إدارة المكتب القانوني</p>
      </div>
    </div>

    <button type="button" class="btn btn-secondary mobile-menu" [attr.aria-expanded]="menuOpen()" aria-controls="office-navigation" (click)="menuOpen.set(!menuOpen())">{{menuOpen()?'إغلاق القائمة':'قائمة المكتب'}}</button>
    <nav id="office-navigation" class="nav" [class.mobile-open]="menuOpen()">
      @for (item of navigation(); track item.path) {
        <a
          class="nav-link" (click)="menuOpen.set(false)"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <div class="sidebar-footer" [class.mobile-open]="menuOpen()">
      <div class="user-block">
        <strong>{{ user()?.name }}</strong>
        <span>{{ user()?.email }}</span>
      </div>
      <button class="btn btn-secondary" type="button" (click)="logout()">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
