server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 55MB
  application:
    name: legaldesk-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

app:
  currency: ${APP_CURRENCY:SAR}
  public-url: ${APP_PUBLIC_URL:http://localhost:4020}
  settings-key-file: ${APP_SETTINGS_KEY_FILE:.data/settings.key}
  vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}
